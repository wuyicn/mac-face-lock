name: Build inspectable offline beta

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifact:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build-lock.txt
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"
      - name: Verify pinned release builder
        run: |
          uv --version | grep -Fx "uv 0.11.13"
          grep -Fx "PyInstaller==6.21.0" requirements-build.txt
          python -m pip install \
            -r requirements-lock.txt \
            -r requirements-build-lock.txt
          python -m PyInstaller --version | grep -Fx "6.21.0"
      - name: Build and validate offline artifact
        run: scripts/build-release.sh
      - name: Upload ZIP and checksum for manual acceptance
        uses: actions/upload-artifact@v6
        with:
          name: mac-face-lock-0.2.0-beta-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release/Mac-Face-Lock-0.2.0-beta-arm64.zip
            dist/release/Mac-Face-Lock-0.2.0-beta-arm64.zip.sha256
